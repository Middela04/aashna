<div id="screen-profile" class="screen">
<div class="p-hdr">
  <div class="avi" id="avi" onclick="toggleAvi()">🌸</div>
  <div class="avi-picker" id="avi-picker">
    <div class="avi-o" onclick="setAvi('🌸')">🌸</div>
    <div class="avi-o" onclick="setAvi('🌺')">🌺</div>
    <div class="avi-o" onclick="setAvi('🌻')">🌻</div>
    <div class="avi-o" onclick="setAvi('🌿')">🌿</div>
    <div class="avi-o" onclick="setAvi('✨')">✨</div>
    <div class="avi-o" onclick="setAvi('🦋')">🦋</div>
    <div class="avi-o" onclick="setAvi('🕊️')">🕊️</div>
  </div>
  <div class="p-name" id="pname">Priya</div>
  <div class="p-lvl" id="plvl">Level 1 · Seeker 🌱</div>
</div>
<div class="stats-fl">
  <div class="sc"><span class="sbig" id="p-streak">0</span><span class="ssm">Day Streak</span></div>
  <div class="sc"><span class="sbig" id="p-xp">0</span><span class="ssm">Total XP</span></div>
  <div class="sc"><span class="sbig" id="p-lessons">0</span><span class="ssm">Lessons</span></div>
</div>
<div class="pp">
  <div class="sec">Badges</div>
  <div class="bgrid" id="badge-grid"></div>
  <div class="dvd"></div>
  <div class="sec">Module Progress</div>
  <div id="mod-progress-rows"></div>
  <div class="dvd"></div>
  <div class="sec">App Info</div>
  <div class="info-list">
    <button class="info-row" onclick="go('screen-privacy')"><span>Privacy Policy</span><strong>→</strong></button>
    <button class="info-row" onclick="go('screen-terms')"><span>Terms of Use</span><strong>→</strong></button>
    <button class="info-row" onclick="go('screen-support')"><span>Support</span><strong>→</strong></button>
  </div>
</div>
<button class="prov-btn" onclick="openProvSheet()">📋 Share Progress with Provider</button>
<div style="padding:0 22px 24px;font-size:11px;color:var(--br-lt);line-height:1.7;text-align:center">Khushii supports but does not replace professional care. Always consult your provider for clinical guidance.</div>
</div>
