<!-- ════ HOME ════ -->
<div id="screen-home" class="screen">
<div class="home-hdr">
  <div class="home-hero-art" aria-hidden="true"></div>
  <div class="home-gr" id="home-gr">Hey ✨</div>
  <div class="home-title">Your Space</div>
  <div class="home-pills">
    <div class="pill" id="streak-pill">🔥 <span id="streak-n">0</span>day streak</div>
    <div class="pill" id="xp-pill"><span class="mhisa-inline-icon mhisa-inline-icon-sm" aria-hidden="true"></span><span id="xp-n">0</span> XP</div>
    <div class="pill" id="level-pill">💎 Level <span id="lvl-n">1</span></div>
  </div>
</div>
<div class="pad" style="padding-bottom:0">
  <div class="sec">How are you feeling?</div>
  <button class="btn-te" style="margin-bottom:14px" onclick="go('screen-checkin')">Open Daily Check-In</button>
  <div class="mood-row" id="mood-row">
    <button class="mood-btn" onclick="selectMood(this,'😰','Anxious')">😰<span class="mood-label">Anxious</span></button>
    <button class="mood-btn" onclick="selectMood(this,'😔','Sad')">😔<span class="mood-label">Sad</span></button>
    <button class="mood-btn" onclick="selectMood(this,'😐','Okay')">😐<span class="mood-label">Okay</span></button>
    <button class="mood-btn" onclick="selectMood(this,'🙂','Good')">🙂<span class="mood-label">Good</span></button>
    <button class="mood-btn" onclick="selectMood(this,'😊','Great')">😊<span class="mood-label">Great</span></button>
  </div>
</div>
<div class="pad" style="padding-top:12px">
  <div class="cont-card" id="home-continue" onclick="goMod('bounds')">
    <div class="cont-icon">🌿</div>
    <div class="cont-main">
      <div class="cont-title">Continue: Maintaining Boundaries</div>
      <div class="cont-sub">Next: Lesson 3 · At Family Gatherings</div>
      <div class="bw cont-progress"><div class="bf cont-progress-fill" style="width:33%"></div></div>
    </div>
    <button class="cont-go">Go</button>
  </div>
  <div class="sec">Quick Tools</div>
  <div class="strip-row" style="margin-bottom:20px">
    <div class="strip-btn" onclick="go('screen-breathbox')"><div class="strip-c">🫁</div><span class="strip-lb">Box Breathing</span></div>
    <div class="strip-btn" onclick="go('screen-senses')"><div class="strip-c">👁️</div><span class="strip-lb">5 Senses</span></div>
    <div class="strip-btn" onclick="go('screen-affirmations')"><div class="strip-c">✨</div><span class="strip-lb">Affirmations</span></div>
    <div class="strip-btn" onclick="go('screen-journal')"><div class="strip-c">📔</div><span class="strip-lb">Journal</span></div>
    <div class="strip-btn" onclick="go('screen-textline')"><div class="strip-c">💬</div><span class="strip-lb">Text Line</span></div>
    <div class="strip-btn" onclick="go('screen-boundary-builder')"><div class="strip-c">🛡️</div><span class="strip-lb">Boundary Script</span></div>
    <div class="strip-btn" onclick="go('screen-toolkit')"><div class="strip-c">🧰</div><span class="strip-lb">Toolkit</span></div>
    <div class="strip-btn" onclick="go('screen-therapy-stigma')"><div class="strip-c">🛋️</div><span class="strip-lb">Therapy Stigma</span></div>
  </div>
  <div class="sec">Today's Affirmation</div>
  <div class="wcard aff-card" style="margin-bottom:6px">
    <div class="aff-card-label">Daily Wisdom</div>
    <div id="home-aff" class="aff-card-copy"></div>
  </div>
</div>
</div>
