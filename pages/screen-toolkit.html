<!-- ════ YOUR TOOLKIT ════ -->
<div id="screen-toolkit" class="screen nosub">
<div class="tool-wrap tool-kit">
  <button class="b-back" onclick="go('screen-activities')">←</button>
  <div class="tool-title">Your Toolkit</div>
  <div class="tool-sub">A quick collection of supports you can come back to.</div>
  <div class="kit-grid">
    <button class="kit-card" onclick="go('screen-breathbox')"><span>🫁</span><strong>Calm my body</strong><small>Box breathing</small></button>
    <button class="kit-card" onclick="go('screen-senses')"><span>👁️</span><strong>Ground me now</strong><small>5 senses</small></button>
    <button class="kit-card" onclick="go('screen-affirmations')"><span>✨</span><strong>Give me words</strong><small>Affirmations</small></button>
    <button class="kit-card" onclick="go('screen-journal')"><span>📔</span><strong>Let me reflect</strong><small>Journal</small></button>
  </div>
  <div class="tool-panel">
    <label class="tool-lbl">My go-to coping phrase</label>
    <textarea class="tool-area" id="kit-phrase" placeholder="Example: I can pause before I respond."></textarea>
    <button class="tool-btn tool-btn-lite" id="kit-phrase-btn" onclick="saveToolkitPhrase()">Save Phrase</button>
    <label class="tool-lbl">Someone safe I can reach out to</label>
    <input class="tool-input" id="kit-person" placeholder="Name or initials">
    <button class="tool-btn tool-btn-lite" id="kit-person-btn" onclick="saveToolkitPerson()">Save Support</button>
    <button class="tool-btn" onclick="clearToolkitInputs()">Clear Inputs</button>
  </div>
  <div class="tool-panel">
    <label class="tool-lbl">Saved supports</label>
    <div id="kit-items"></div>
  </div>
  <div class="script-card" id="kit-summary"></div>
</div>
</div>
