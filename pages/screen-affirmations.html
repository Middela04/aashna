<!-- ════ AFFIRMATIONS ════ -->
<div id="screen-affirmations" class="screen nosub">
<div class="aff-wrap">
  <button class="b-back" onclick="go('screen-activities')">←</button>
  <div class="aff-cat">Choose a topic</div>
  <div class="aff-tabs" id="aff-tabs"></div>
  <div class="aff-card-wrap"><div class="aff-txt" id="aff-txt">Loading...</div></div>
  <div class="aff-ctx" id="aff-ctx">On belonging</div>
  <div class="aff-dots" id="aff-dots"></div>
  <div class="aff-nav">
    <button class="aff-arr" onclick="prevAff()">←</button>
    <button class="aff-heart" id="aff-heart" onclick="toggleHeart()">🤍</button>
    <button class="aff-arr" onclick="nextAff()">→</button>
  </div>
  <div class="aff-saved" id="aff-saved-info">Tap ❤️ to save · <span id="aff-saved-n">0</span> saved</div>
</div>
</div>
